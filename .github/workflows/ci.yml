name: CI

on:
  push:
    branches: [main, landing]
  pull_request:
    branches: [main, landing]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # CI=true keeps Astro non-interactive; verify-static.mjs asserts
      # required public assets, canonical logo treatment, and load-bearing
      # copy in the built HTML (see scripts/verify-static.mjs).
      - name: Build
        run: CI=true pnpm build

      - name: Verify static output
        run: pnpm check

      - name: Verify release resolution and stats failure handling
        run: pnpm test:unit

      - name: Verify browser interactions
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "landing" ]; then
            # The production branch ships the redesign. The retained Reforged
            # suite targets its retired predecessor, not the current homepage.
            pnpm exec playwright test tests/redesign.spec.ts tests/quickstart.spec.ts tests/download-evidence.spec.ts
          else
            pnpm check:browser
          fi
